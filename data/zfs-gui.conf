# zfs-gui 后台服务配置
#
# 修改后需要重启守护进程：
#   # service zfsguid restart
#
# allowed_users  : 允许连接守护进程的用户名（逗号分隔），root 始终允许
# allowed_groups : 允许连接的组名（逗号分隔），通常与 socket_group 保持一致
# socket_path    : Unix socket 路径（目录会以 0700 创建）
# socket_group   : socket 文件属组
# socket_mode    : socket 文件权限（八进制）
# io_timeout     : 普通操作超时秒数，0 表示不限制（长耗时操作始终不限制）
#
# 安全相关：
# auth_mode           : dangerous（默认，仅危险操作要求管理员密码）
#                       all（所有写操作都要求密码） / none（从不要求，不推荐）
# auth_max_attempts   : 同一用户连续认证失败多少次后锁定
# auth_lockout        : 锁定时长（秒）

allowed_users = root
allowed_groups = wheel
socket_path = /var/run/zfs-gui/zfs-gui.sock
socket_group = wheel
socket_mode = 0660
io_timeout = 600

auth_mode = dangerous
auth_max_attempts = 3
auth_lockout = 300
